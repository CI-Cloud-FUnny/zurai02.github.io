<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>zurai02</title>
<style>
  :root{color-scheme:light dark;--bg:#f5f6f7;--fg:#16181b;--muted:#656b73;--line:#d8dbdf}
  @media (prefers-color-scheme:dark){:root{--bg:#111316;--fg:#e8eaed;--muted:#939aa3;--line:#2a2e34}}
  html{background:var(--bg)}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  [hidden]{display:none!important}
  main{width:min(420px,100%)}
  h1{margin:0 0 8px;font-size:1.5rem;line-height:1.25;font-weight:600;letter-spacing:-.015em;overflow-wrap:anywhere}
  p{margin:0;color:var(--muted);max-width:44ch}
  nav{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 22px}
  a{color:var(--fg);text-underline-offset:3px;text-decoration-thickness:1px}
  a:hover,a:focus-visible{text-decoration-thickness:2px}
  a:focus-visible{outline:2px solid currentColor;outline-offset:3px;border-radius:2px}
</style>
</head>
<body>

<!-- Stays hidden (page is blank) unless there is nothing to redirect to -->
<main id="card" hidden>
  <h1 id="title"></h1>
  <p id="msg"></p>
  <nav>
    <a href="/">Home</a>
    <a href="https://github.com/zurai02?tab=repositories">All repositories</a>
    <a id="extra" hidden>Open repository</a>
  </nav>
</main>

<noscript>
  <main>
    <h1>JavaScript is turned off</h1>
    <p>This page needs it to find the project you asked for.</p>
    <nav><a href="https://github.com/zurai02">Go to GitHub</a></nav>
  </main>
</noscript>

<script>
(function () {
  var USER = "zurai02";
  var card = document.getElementById("card");
  var title = document.getElementById("title");
  var msg = document.getElementById("msg");
  var extra = document.getElementById("extra");

  // Only ever called when there is nothing to redirect to
  function fail(t, m, repoUrl) {
    title.textContent = t;
    msg.textContent = m;
    if (repoUrl) { extra.href = repoUrl; extra.hidden = false; }
    card.hidden = false;
    document.title = t;
  }

  // Only a single clean segment like /luazi counts as a repo name
  var parts = location.pathname.split("/").filter(Boolean);
  var name = parts[0] || "";
  if (parts.length !== 1 || !/^[A-Za-z0-9._-]+$/.test(name) || name === "." || name === "..") {
    fail("Page not found", "There's nothing at this address.");
    return;
  }

  var target = "https://github.com/" + USER + "/" + encodeURIComponent(name);
  var done = false;
  function go() {
    if (done) return;
    done = true;
    location.replace(target);
  }

  // If GitHub's API is slow, redirect anyway after 4 seconds
  var timer = setTimeout(go, 4000);

  fetch("https://api.github.com/repos/" + USER + "/" + encodeURIComponent(name))
    .then(function (r) {
      if (r.status === 404) {
        clearTimeout(timer);
        done = true;
        fail("No public repo named " + name, "Check the spelling. If it exists, it may be private.");
        return null;
      }
      if (!r.ok) { go(); return null; } // rate limit or error: redirect anyway
      return r.json();
    })
    .then(function (repo) {
      if (!repo) return;
      clearTimeout(timer);
      if (repo.has_pages) {
        // The repo publishes its own site, so don't take it over
        done = true;
        fail(name + " has its own site", "It isn't loading right now. You can open the repository instead.", target);
        return;
      }
      go();
    })
    .catch(go);
})();
</script>
</body>
</html>
