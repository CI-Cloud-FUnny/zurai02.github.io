<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#ff6b35" />
  <title>404 — zurai02</title>

  <!-- Fonts matching zurai02.is-a.dev -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #090a0d;
      color: #e6e8ec;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* Background glow matching the hero of zurai02.is-a.dev */
    .bg-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(255, 107, 53, 0.12) 0%, rgba(255, 107, 53, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    [hidden] {
      display: none !important;
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(480px, 100%);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 32px 28px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      animation: fadeIn 0.3s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tag-error {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 107, 53, 0.12);
      border: 1px solid rgba(255, 107, 53, 0.3);
      color: #ff6b35;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #ff6b35;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff6b35;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }

    p {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
      overflow-wrap: anywhere;
    }

    .repo-name {
      color: #ff6b35;
      font-family: 'JetBrains Mono', monospace;
      background: rgba(255, 107, 53, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 107, 53, 0.2);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: #ff6b35;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(255, 107, 53, 0.25);
    }

    .btn-primary:hover {
      background: #ff7e4f;
      box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-color: rgba(255, 107, 53, 0.3);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="bg-glow" aria-hidden="true"></div>

  <!-- Hidden while querying GitHub API, only displays if repo does not exist -->
  <main class="card" id="card" hidden>
    <div class="badge-row">
      <span class="tag-error">
        <span class="dot"></span>
        <span id="badge-text">404 // NOT_FOUND</span>
      </span>
    </div>
    <h1 id="title">Repository Not Found</h1>
    <p id="msg"></p>
    <div class="actions">
      <a href="https://github.com/zurai02?tab=repositories" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
        Browse Repositories <span>→</span>
      </a>
      <a href="/" class="btn btn-ghost">Home</a>
    </div>
  </main>

  <noscript>
    <main class="card">
      <div class="badge-row">
        <span class="tag-error">404 // JAVASCRIPT_REQUIRED</span>
      </div>
      <h1>JavaScript Required</h1>
      <p>Please enable JavaScript to allow repository resolution and redirection.</p>
      <div class="actions">
        <a href="https://github.com/zurai02?tab=repositories" class="btn btn-primary">View Repositories</a>
        <a href="/" class="btn btn-ghost">Home</a>
      </div>
    </main>
  </noscript>

  <script>
    (function () {
      var USER = "zurai02";
      var card = document.getElementById("card");
      var title = document.getElementById("title");
      var msg = document.getElementById("msg");
      var badgeText = document.getElementById("badge-text");

      function showError(errTitle, errMsg, tag) {
        title.textContent = errTitle;
        msg.innerHTML = errMsg;
        if (tag) badgeText.textContent = tag;
        document.title = errTitle + " — zurai02";
        card.hidden = false;
      }

      // Extract repository segment (e.g. zurai02.is-a.dev/luazi -> luazi)
      var segments = window.location.pathname.split("/").filter(Boolean);
      var repoName = segments[0] || "";

      // Only single segment paths are treated as potential repos
      if (segments.length !== 1 || !/^[A-Za-z0-9_.-]+$/.test(repoName) || repoName === "." || repoName === "..") {
        showError(
          "Page Not Found",
          "There is no repository or page at this path.",
          "404 // INVALID_PATH"
        );
        return;
      }

      var targetRepoUrl = "https://github.com/" + USER + "/" + encodeURIComponent(repoName);
      var resolved = false;

      function redirect() {
        if (resolved) return;
        resolved = true;
        window.location.replace(targetRepoUrl);
      }

      // If GitHub API is delayed or unresponsive, fall back after 3.5s
      var timeoutTimer = setTimeout(redirect, 3500);

      // Check strictly if the repo exists (no profile redirects)
      fetch("https://api.github.com/repos/" + USER + "/" + encodeURIComponent(repoName))
        .then(function (res) {
          if (res.status === 404) {
            clearTimeout(timeoutTimer);
            resolved = true;
            showError(
              "Repository Not Found",
              'No public repository matching <span class="repo-name">' + repoName + "</span> was found on @" + USER + ".",
              "404 // REPO_NOT_FOUND"
            );
            return null;
          }
          if (!res.ok) {
            // If rate-limited (403/429) or other API issue, forward anyway
            redirect();
            return null;
          }
          return res.json();
        })
        .then(function (data) {
          if (!data) return;
          clearTimeout(timeoutTimer);
          redirect();
        })
        .catch(redirect);
    })();
  </script>
</body>
</html>
